<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
    <style>
      body { margin: 0; background: #000; color: #eee; font-family: VT323, monospace; }
      .wrap { max-width: 820px; margin: 0 auto; padding: 28px 18px; }
      h1 { font-family: 'Press Start 2P', monospace; font-size: 16px; line-height: 1.5; }
      p { font-size: 22px; line-height: 1.35; color: #cfcfcf; }
      .box { border: 2px solid #fff; padding: 16px; margin: 16px 0; }
      a.btn, button.btn {
        display: inline-block; margin: 8px 8px 0 0; padding: 12px 14px; border: 2px solid #fff;
        background: #fff; color: #000; text-decoration: none; font-family: 'Press Start 2P', monospace;
        font-size: 10px; cursor: pointer;
      }
      a.ghost, button.ghost { background: transparent; color: #fff; }
      code { color: #9fe7b4; word-break: break-all; }
    </style>
  </head>
  <body>
    <div class="wrap" id="app"></div>
    <script>
      const id = new URLSearchParams(location.search).get('id') || 'bot'
      const data = {
        void: {
          title: 'VOID.OS Board',
          path: 'voidos-main',
          text: 'Live voidmind map board: claim, ledger, interactive lots.',
          stack: 'Web3, React, Live',
          demo: 'https://ashy-gamma-42.vercel.app/'
        },
        nexus: {
          title: 'NEXUS',
          path: '0000',
          text: 'Shared digital character: 128 cells, honeycomb cortex, public memory.',
          stack: 'Next.js, 3D',
          demo: 'https://nexus-nine-wine-41.vercel.app/'
        },
        ebay: {
          title: 'BayFinder (eBay Search)',
          path: 'public/demos/ebay',
          text: 'Live eBay via SerpApi + deal scoring.',
          stack: 'SerpApi eBay Search API, Vite proxy',
          demo: '/demos/ebay/index.html'
        },
        tribal: {
          title: 'INKWARD',
          path: 'public/demos/tribal',
          text: 'Neo tribal studio with gallery, journal, booking and CMS.',
          stack: 'Brand, CMS, Book',
          demo: '/demos/tribal/index.html'
        },
        cafe: {
          title: 'KŌHI',
          path: 'public/demos/cafe',
          text: 'Café brand site: menu, cart, pay flow.',
          stack: 'Cafe, Brand, Pay',
          demo: '/demos/cafe/index.html'
        },
        buh: {
          title: 'Buh Bot + Parsers',
          path: 'buh-bot_1',
          text: 'Accounting bot: PDF/DOCX/OCR, Excel, Google Sheets.',
          stack: 'aiogram, easyocr, pandas, gspread',
          demo: '/demos/buh/index.html'
        },
        bot: {
          title: 'Access / Pay Bot',
          path: 'bot',
          text: 'Telegram access & payment bot with TON webapp checkout.',
          stack: 'aiogram, TON, WebApp',
          demo: '/demos/bot/index.html'
        },
        shop: {
          title: 'Shop / Orders Bot',
          path: 'public/demos/shop',
          text: 'Catalog, cart and checkout inside Telegram.',
          stack: 'Telegram, Shop, Orders',
          demo: '/demos/shop/index.html'
        },
        support: {
          title: 'Support / CRM Bot',
          path: 'public/demos/support',
          text: 'Tickets, statuses and admin replies in Telegram.',
          stack: 'aiogram, CRM, Support',
          demo: '/demos/support/index.html'
        },
        clinic: {
          title: 'Clinic Group Parser Bot',
          path: 'public/demos/clinic',
          text: 'Collect messages from Telegram groups + Excel export.',
          stack: 'python-telegram-bot, openpyxl, SQLite',
          demo: '/demos/clinic/index.html'
        },
        films: {
          title: 'Film Advisor Bot',
          path: 'public/demos/films',
          text: 'Telegram film advisor by mood and genre.',
          stack: 'aiogram, Python',
          demo: '/demos/films/index.html'
        },
        tasty: {
          title: 'Tasty Beach Merge',
          path: '0101',
          text: 'Casual merge game on Python + Kivy.',
          stack: 'Python, Kivy, Mobile',
          demo: '/demos/tasty/index.html'
        },
        ext: {
          title: 'TranslateFlow',
          path: 'tf3',
          text: 'Chrome MV3 extension: detect language + translate selection on-page.',
          stack: 'Chrome Extension, JS',
          demo: '/demos/ext/index.html'
        }
      }
      const p = data[id] || data.bot
      document.title = p.title + ' — MYDANCHIK'
      document.getElementById('app').innerHTML = `
        <a class="btn ghost" href="/">← BACK</a>
        <h1>${p.title}</h1>
        <div class="box">
          <p>${p.text}</p>
          <p><b>STACK:</b> ${p.stack}</p>
          <p><b>PATH:</b><br/><code>${p.path}</code></p>
          <a class="btn" href="${p.demo}" target="_blank">OPEN DEMO</a>
          <button class="btn ghost" id="copyBtn" type="button">COPY PATH</button>
        </div>
      `
      document.getElementById('copyBtn').onclick = async () => {
        await navigator.clipboard.writeText(p.path)
      }
    </script>
  </body>
</html>
