<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Film Advisor Demo</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&display=swap" rel="stylesheet" />
    <style>
      body { margin: 0; background: #050505; color: #eee; font-family: VT323, monospace; }
      .wrap { max-width: 760px; margin: 0 auto; padding: 24px 16px; }
      h1 { font-family: 'Press Start 2P', monospace; font-size: 15px; line-height: 1.5; }
      .card { border: 2px solid #fff; padding: 14px; margin: 12px 0; }
      .row { display: flex; gap: 8px; flex-wrap: wrap; }
      button, a.btn {
        border: 2px solid #fff; background: #fff; color: #000; font-family: 'Press Start 2P', monospace;
        font-size: 9px; padding: 10px 12px; cursor: pointer; text-decoration: none;
      }
      a.ghost { background: transparent; color: #fff; }
      #out { font-size: 22px; line-height: 1.35; min-height: 80px; }
      .muted { color: #aaa; font-size: 20px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <a class="btn ghost" href="/">← BACK</a>
      <h1>FILM ADVISOR DEMO</h1>
      <p class="muted">Выбери жанр — бот предложит фильм.</p>
      <div class="card row">
        <button type="button" data-g="sci-fi">SCI-FI</button>
        <button type="button" data-g="comedy">COMEDY</button>
        <button type="button" data-g="thriller">THRILLER</button>
        <button type="button" data-g="anime">ANIME</button>
      </div>
      <div class="card" id="out">Жду жанр…</div>
    </div>
    <script>
      const db = {
        'sci-fi': ['Interstellar', 'Blade Runner 2049', 'Dune'],
        comedy: ['The Grand Budapest Hotel', 'Superbad', 'Hot Fuzz'],
        thriller: ['Se7en', 'Gone Girl', 'Prisoners'],
        anime: ['Your Name', 'Spirited Away', 'Akira'],
      }
      const out = document.getElementById('out')
      document.querySelectorAll('button[data-g]').forEach((b) => {
        b.onclick = () => {
          const list = db[b.dataset.g]
          const pick = list[Math.floor(Math.random() * list.length)]
          out.innerHTML = `<b>жанр:</b> ${b.dataset.g}<br/><b>рекомендация:</b> ${pick}<br/><span style="color:#9fe7b4">bot: /recommend ok</span>`
        }
      })
    </script>
  </body>
</html>
