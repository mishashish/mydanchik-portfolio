<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VOID.OS Demo Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../_shared/demo-note.css" />
    <style>
      body { margin: 0; background: #050505; color: #eee; font-family: VT323, monospace; }
      .wrap { max-width: 820px; margin: 0 auto; padding: 24px 16px; }
      h1 { font-family: 'Press Start 2P', monospace; font-size: 16px; line-height: 1.5; }
      .card { border: 2px solid #fff; padding: 16px; margin: 12px 0; }
      p { font-size: 22px; line-height: 1.35; color: #cfcfcf; }
      .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
      .stats div { border: 1px solid #444; padding: 10px; text-align: center; }
      .stats b { display: block; font-family: 'Press Start 2P', monospace; font-size: 12px; color: #fff; margin-bottom: 6px; }
      a.btn {
        display: inline-block; margin: 8px 8px 0 0; padding: 12px 14px; border: 2px solid #fff;
        background: #fff; color: #000; text-decoration: none; font-family: 'Press Start 2P', monospace; font-size: 10px;
      }
      a.ghost { background: transparent; color: #fff; }
      @media (max-width: 600px) { .stats { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <div class="wrap">
      <a class="btn ghost" href="/">← BACK</a>
      <h1>VOID.OS / VOIDMIND</h1>
      <div class="card">
        <p>
          Web3 map board: claim constellation lots, live ledger, probe lore.
          Live app already deployed.
        </p>
        <div class="stats">
          <div><b>50k</b>sectors</div>
          <div><b>500</b>systems</div>
          <div><b>200</b>lots</div>
        </div>
        <a class="btn" href="https://ashy-gamma-42.vercel.app/" target="_blank" rel="noreferrer">
          OPEN LIVE SITE
        </a>
      </div>
    </div>
    <script src="../_shared/demo-note.js"></script>
  </body>
</html>
