<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Переход к оплате...</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      margin: 0; display: flex; justify-content: center; align-items: center;
      min-height: 100vh; font-family: system-ui, sans-serif;
      background: #f0f4ff; color: #333;
    }
    .box {
      text-align: center; padding: 32px 24px; max-width: 360px;
      background: #fff; border-radius: 20px;
      box-shadow: 0 4px 24px rgba(0,0,0,.1);
    }
    .icon { font-size: 56px; margin-bottom: 12px; }
    h2 { margin: 0 0 8px; font-size: 20px; }
    p  { margin: 0 0 20px; opacity: .65; font-size: 14px; line-height: 1.5; }
    .btn {
      display: block; width: 100%; padding: 14px;
      border-radius: 12px; border: 0; font-size: 15px; font-weight: 700;
      cursor: pointer; text-decoration: none; text-align: center;
      background: #2f7df6; color: #fff; margin-bottom: 10px; box-sizing: border-box;
    }
    .btn.secondary { background: rgba(0,0,0,.08); color: #333; }
    code {
      display: inline-block; background: #f4f4f8; border-radius: 8px;
      padding: 4px 8px; font-size: 12px; word-break: break-all;
      cursor: pointer; border: 1px solid #ddd;
    }
    .copied { color: #27ae60; font-size: 13px; margin-top: 6px; display: none; }
  </style>
</head>
<body>
<div class="box">
  <div class="icon">💎</div>
  <h2>Оплата TON</h2>
  <p id="desc">Подготавливаем перевод...</p>

  <div id="btns"></div>

  <div style="margin-top:16px;font-size:13px;opacity:.6">
    <div>Адрес: <code id="addr_code" onclick="copyField('to')">—</code></div>
    <div style="margin-top:6px">Комментарий: <code id="text_code" onclick="copyField('text')">—</code></div>
    <div class="copied" id="copied_msg">✅ Скопировано</div>
  </div>
</div>

<script>
  const tg = window.Telegram?.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  const p = new URLSearchParams(location.search);
  const to      = p.get("to") || "";
  const nano    = p.get("amount_nanoton") || "";
  const amtTon  = p.get("amount_ton") || "";
  const text    = p.get("text") || "";
  const tier    = p.get("tier") || "";
  const usd     = p.get("usd") || "";

  const tierMap = { bronze:"🥉 Бронза", silver:"🥈 Серебро", gold:"🥇 Золото" };

  document.getElementById("addr_code").textContent = to || "—";
  document.getElementById("text_code").textContent = text || "—";
  document.getElementById("desc").textContent =
    `${tierMap[tier] || tier} • ${usd} $ • ${amtTon} TON`;

  const tonUrl       = `ton://transfer/${to}?amount=${nano}&text=${encodeURIComponent(text)}`;
  const tonkeeperUrl = `https://app.tonkeeper.com/transfer/${to}?amount=${nano}&text=${encodeURIComponent(text)}`;

  // Determine platform
  const platform = tg?.platform || "";
  const isMobile = ["ios","android"].includes(platform)
    || /android|iphone|ipad/i.test(navigator.userAgent);

  const btns = document.getElementById("btns");

  if (isMobile) {
    const a = document.createElement("button");
    a.className = "btn";
    a.textContent = "💎 Открыть кошелёк и оплатить";
    a.onclick = () => { window.location.href = tonUrl; };
    btns.appendChild(a);
  } else {
    // Desktop: Tonkeeper web — opens in browser with data pre-filled
    const a = document.createElement("a");
    a.className = "btn";
    a.textContent = "🌐 Открыть Tonkeeper (ПК)";
    a.href = tonkeeperUrl;
    a.target = "_blank";
    btns.appendChild(a);

    const b = document.createElement("button");
    b.className = "btn secondary";
    b.textContent = "📋 Скопировать реквизиты";
    b.onclick = copyAll;
    btns.appendChild(b);
  }

  function copyField(field) {
    const val = field === "to" ? to : text;
    navigator.clipboard.writeText(val).then(() => showCopied()).catch(() => {});
  }

  function copyAll() {
    const s = `Адрес: ${to}\nСумма: ${amtTon} TON\nКомментарий: ${text}`;
    navigator.clipboard.writeText(s).then(() => showCopied()).catch(() => prompt("Скопируйте:", s));
  }

  function showCopied() {
    const el = document.getElementById("copied_msg");
    el.style.display = "block";
    setTimeout(() => el.style.display = "none", 2000);
  }

  // No auto-redirect — user taps the button
</script>
</body>
</html>
