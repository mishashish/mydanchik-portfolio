<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clinic Parser Demo</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&display=swap" rel="stylesheet" />
    <style>
      body { margin: 0; background: #050505; color: #eee; font-family: VT323, monospace; }
      .wrap { max-width: 820px; margin: 0 auto; padding: 24px 16px; }
      h1 { font-family: 'Press Start 2P', monospace; font-size: 15px; line-height: 1.5; }
      .card { border: 2px solid #fff; padding: 14px; margin: 12px 0; }
      textarea { width: 100%; min-height: 110px; background: #111; color: #fff; border: 1px solid #444; font: inherit; font-size: 18px; padding: 10px; box-sizing: border-box; }
      button, a.btn {
        border: 2px solid #fff; background: #fff; color: #000; font-family: 'Press Start 2P', monospace;
        font-size: 9px; padding: 10px 12px; cursor: pointer; text-decoration: none; margin-top: 10px; display: inline-block;
      }
      a.ghost, button.ghost { background: transparent; color: #fff; }
      table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 18px; }
      td, th { border: 1px solid #444; padding: 8px; text-align: left; }
      .muted { color: #aaa; font-size: 20px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <a class="btn ghost" href="/">← BACK</a>
      <h1>CLINIC PARSER DEMO</h1>
      <p class="muted">Вставь сообщение из Telegram-группы — получи строку отчёта.</p>
      <div class="card">
        <textarea id="msg">ПЕРЕДАЛ
ПОЛИКЛИНИКА: Центральная
ПАЦИЕНТ: Иванов И.И.
ВРЕМЯ: 14:30
ПРИМЕЧАНИЕ: ок</textarea>
        <button type="button" id="parse">PARSE</button>
      </div>
      <div class="card">
        <table>
          <thead><tr><th>Поле</th><th>Значение</th></tr></thead>
          <tbody id="tb"><tr><td colspan="2">—</td></tr></tbody>
        </table>
      </div>
    </div>
    <script>
      const tb = document.getElementById('tb')
      document.getElementById('parse').onclick = () => {
        const text = document.getElementById('msg').value
        const rows = []
        text.split(/\n+/).forEach((line) => {
          const m = line.match(/^([^:]+):\s*(.+)$/)
          if (m) rows.push([m[1].trim(), m[2].trim()])
          else if (line.trim()) rows.push(['TAG', line.trim()])
        })
        tb.innerHTML = rows.map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join('') || '<tr><td colspan="2">пусто</td></tr>'
      }
    </script>
  </body>
</html>
